<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin: 0; padding: 0; background-color: #F5F3F0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F5F3F0; padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="460" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden;">
          <!-- Logo -->
          <tr>
            <td align="center" style="padding: 36px 40px 24px;">
              <img src="https://ves.sg/cdn/shop/files/logo_04a04687-57f4-4141-b0bc-ec30b527fd73.png?v=1686045719&width=600" alt="VES" width="120" style="display: block;" />
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td align="center" style="padding: 0 40px 32px;">
              <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 600; color: #282828;">
                Sign in to VES Clay Club
              </h1>
              <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #888888;">
                Click the button below to securely sign in. This link expires in 1 hour.
              </p>
              <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; padding: 14px 32px; background-color: #C4622D; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 8px;">
                Sign in
              </a>
            </td>
          </tr>
          <!-- Divider -->
          <tr>
            <td style="padding: 0 40px;">
              <hr style="border: none; border-top: 1px solid rgba(40,40,40,0.09); margin: 0;" />
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 20px 40px 28px;">
              <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #888888;">
                If you didn't request this email, you can safely ignore it.
              </p>
              <p style="margin: 8px 0 0; font-size: 12px; color: #888888;">
                VES Clay Studio &middot; Singapore
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
